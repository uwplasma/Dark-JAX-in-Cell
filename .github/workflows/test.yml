name: Midnight checks
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: python -m flake8 darkjaxincell tests examples docs/scripts
      - run: python -c "import darkjaxincell"
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - run: uv venv && uv pip install -e '.[test,docs]'
      - run: uv run python -m flake8 darkjaxincell tests examples docs/scripts
      - run: uv run python -m pytest -q --cov=darkjaxincell --cov-report=term
      - run: uv run python examples/dark_photon.py
      - run: uv run python examples/dark_drive.py
      - run: uv run python examples/dark_plasma.py
      - run: uv run python examples/dark_kinetic.py
      - run: uv run python examples/dark_instabilities.py
      - run: uv run python examples/dark_saturation.py
      - run: uv run python examples/dark_bump.py
      - run: uv run python docs/scripts/benchmark_time_integrators.py
      - run: uv run python -c "import runpy; runpy.run_path('examples/dark_instabilities.py', run_name='__main__', init_globals={'mode':'weibel'})"
      - run: uv run python examples/dark_null.py
      - run: uv run python examples/dark_reservoir.py
      - run: uv run python examples/optimize_dark_photon.py
      - run: uv run python examples/dark_profile.py
      - run: uv run python -m sphinx -b html -W docs docs/_build/html
      - run: uv run python -c "from pathlib import Path; assert not any('{{ ' in p.read_text() for p in Path('docs/_build/html').rglob('*.html'))"
  gpu:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, uwplasma-gpu]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv venv && uv pip install -e '.[test]' 'jax[cuda12]'
      - run: uv run python -c "import jax; assert jax.default_backend()=='gpu', jax.devices()"
      - name: GPU tests
        timeout-minutes: 1
        run: uv run python -m pytest -m gpu -q -x --no-cov tests/test_gpu.py
