name: Midnight checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test,docs]'
      - run: python -m flake8 darkjaxincell tests examples docs/scripts
      - run: python -m pytest -q
      - run: python examples/dark_photon.py --quick
      - run: python -m sphinx -b html -W docs docs/_build/html
