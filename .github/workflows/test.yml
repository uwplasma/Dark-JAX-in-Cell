name: Midnight checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test,docs]'
      - run: python -m flake8 darkjaxincell tests examples docs/scripts
      - run: python -m pytest -q --cov=darkjaxincell --cov-report=term
      - run: python examples/dark_photon.py
      - run: python examples/dark_drive.py
      - run: python examples/dark_plasma.py
      - run: python examples/dark_kinetic.py
      - run: python examples/dark_instabilities.py
      - run: python examples/dark_saturation.py
      - run: python examples/dark_bump.py
      - run: python docs/scripts/benchmark_time_integrators.py
      - run: python -c "import runpy; runpy.run_path('examples/dark_instabilities.py', run_name='__main__', init_globals={'mode':'weibel'})"
      - run: python examples/dark_null.py
      - run: python examples/dark_reservoir.py
      - run: python examples/optimize_dark_photon.py
      - run: python examples/dark_profile.py
      - run: python -m sphinx -b html -W docs docs/_build/html
      - run: python -c "from pathlib import Path; assert not any('{{ ' in p.read_text() for p in Path('docs/_build/html').rglob('*.html'))"
